      - { id: edit_vendor, kind: edit, title: Edit vendor ledger, direct: patch, columns: 2, fields: [ { key: Tally_Ledger, label: Tally ledger name, type: text, required: true }, { key: Expense_Head, label: Expense head, type: text, required: true }, { key: Vendor_GSTIN, label: Vendor GSTIN, type: text }, { key: City, label: City, type: text }, { key: Status, label: Status, type: select, options_status: true } ] }

  - id: centres
    covers: [R19]
    route: /centres
    label: Centres
