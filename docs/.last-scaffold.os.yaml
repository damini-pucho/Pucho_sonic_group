  search:
    - { label: Bills, entity: bills, columns: [Bill_ID, Vendor_Name, Bill_No, Centre], title: Vendor_Name, subtitle: [Bill_No, Status], link: /bills, page: bills }
    - { label: Agreements, entity: agreements, columns: [Agreement_ID, Tenant_Name, Centre], title: Tenant_Name, subtitle: [Centre, Status], link: /income, page: income }
  notifications:
    - { metric: with_director, title: Vendor_Name, subtitle: [Centre], date: Uploaded_At, link: /director-approvals, page: director_approvals }
    - { metric: open_queries, title: Vendor_Name, subtitle: [Query_From, Centre], date: Uploaded_At, link: /bills, page: bills }
    - { metric: due_tomorrow, title: Tenant_Name, subtitle: [Centre], date: Next_Due_Date, link: /income, page: income }

flows:
  - name: BILL_READ
    covers: [R1, R2, R3]
    desc: Reads a bill photo — vendor, bill no, date, GST rate and split, total, narration — and proposes the Tally ledger and expense head
    trigger: { tool: webhook, name: catch_webhook, auth: none }
    constants: { rows_from: [vendor_ledgers] }
    writes: [bills]
    actions:
      - name: extract
        covers: [R1, R2, R3]
        model: advanced
        file: Bill_Photo
        payload: { Bill_Photo: string, Centre: string }
        prompt: |
          You read one expense bill (a phone photo) for Sonic Group, a company that rents and fits out commercial spaces in India.
          The bill was uploaded at the centre {{payload.Centre}}. Read exactly what is printed — never guess a number you cannot see.
          Extract: the vendor name as printed, the vendor GSTIN, the bill number, the bill date (YYYY-MM-DD), the taxable value,
          the GST rate in percent (if several rates are printed, the rate on the largest line), CGST, SGST and IGST amounts
          (0 when absent), the bill total, and a one-line narration of what was bought or done, in plain English.
          Then pick the matching row from Sonic Group's vendor ledger mapping by GSTIN first, then by vendor name and city:
          {{constants.vendor_ledgers}}
          Copy its Tally_Ledger and Expense_Head exactly; when no row matches, leave both empty.
          Reply ONLY with JSON: {"Vendor_Name": "", "Vendor_GSTIN": "", "Bill_No": "", "Bill_Date": "", "Taxable_Value": 0, "GST_Rate": 0, "CGST": 0, "SGST": 0, "IGST": 0, "Total_Amount": 0, "Narration": "", "Tally_Ledger": "", "Expense_Head": "", "AI_Confidence": 0.0}
        result: { Vendor_Name: string, Vendor_GSTIN: string, Bill_No: string, Bill_Date: string, Taxable_Value: number, GST_Rate: number, CGST: number, SGST: number, IGST: number, Total_Amount: number, Narration: string, Tally_Ledger: string, Expense_Head: string, AI_Confidence: number }
        rules: ["Status starts as At Centre; the uploader is the Centre_Coordinator (from the session)", "Taxable_Value + CGST + SGST + IGST must equal Total_Amount within ₹1 — otherwise AI_Confidence is capped at 0.5 in code", "The app numbers the bill (B-YYYY-NNNN)"]
        typical_seconds: 15
        credits: 8
        runs_per_month: 330
        effect:
          insert: bills
          map: { user: Centre_Coordinator }
          fill: { Status: At Centre, Uploaded_At: now }
          result: { Vendor_Name: Shree Electricals, Vendor_GSTIN: 27AAKFS4471M1Z2, Bill_No: SE/2026/902, Bill_Date: "2026-10-08", Taxable_Value: 5400, GST_Rate: 18, CGST: 486, SGST: 486, IGST: 0, Total_Amount: 6372, Narration: "SIMULATED read — sample values; the AI reads the photo once BILL_READ is wired", Tally_Ledger: Shree Electricals - Pune, Expense_Head: Electrical Repairs, AI_Confidence: 0.5 }

  - name: SALES_INVOICE
    covers: [R16]
    desc: Prepares the month's sales invoice from an agreement, the day before it is due
    trigger: { tool: webhook, name: catch_webhook, auth: none }
    writes: [sales_invoices, agreements]
    actions:
      - name: raise
        covers: [R16]
        model: none
        payload: { Agreement_ID: string, Tenant_Name: string, Tenant_State: string, Centre: string, Unit: string, Next_Due_Date: string, Monthly_Amount: number, GST_Rate: number, GST_Type: string, GST_Amount: number, Monthly_Total: number, Tenant_Ledger: string, Income_Head: string }
        result: { Invoice_ID: string }
        rules: ["Period = the month of Next_Due_Date (code)", "Narration = Income_Head + ' for ' + Period + ' — ' + Unit (code)", "The app numbers the invoice (SI-YYYY-NNNN)", "Wired: CODE advances the agreement's Next_Due_Date by one month and sets Invoice_Status back to Upcoming; simulated: the agreement is marked Raised"]
        typical_seconds: 5
        credits: 5
        runs_per_month: 40
        effect:
          insert: sales_invoices
          map: { Next_Due_Date: Due_Date, Monthly_Amount: Taxable_Value, Monthly_Total: Total_Amount }
          fill: { Status: Prepared, Prepared_At: now }
          also: { patch: agreements, only: [Invoice_Status], fill: { Invoice_Status: Raised } }

pages:
  # ───────────── Director ─────────────
