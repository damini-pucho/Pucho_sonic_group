# os.yaml — Sonic Group · Expense & Income OS (clickable demo, v1)
# Source: MoM "Sonic Group Expense & Income Automation", 06 Oct 2026 (Mugdha Borate — Sonic Group; Jainam, Damini — Pucho).
# Card: docs/sonic-group-problem-card.md · intake: docs/00-intake.md · ⚑ = assumption to confirm with the client.
# Shape: a four-stage approval chain (Centre → HO → Director → Accounts) is the app's own CRUD (rule zero, `direct: patch`);
# the AI reads the bill photo (BILL_READ); the Tally import XML is built by code in the app (src/custom/TallyExport);
# a sales invoice is raised from an agreement one day before its due date (SALES_INVOICE).
os:
  name: Sonic Bills & Income
  slug: sonic-group-os
  client: Sonic Group
  mode: client
  one_liner: A centre coordinator photographs an expense bill, AI reads the GST and the narration, the bill is approved by HO, the Director and Accounts online, and Accounts imports it into Tally Prime from one XML — sales invoices from the agreements arrive the day before they are due.
  tagline: Every bill from every centre — approved online, ready for Tally.
  languages: [en]
  volume_per_month: 300                    # ⚑ expense bills / month across all centres (not stated in the MoM)
  success_metric: The Director sees every bill online by day and by vendor, and no bill waits for a hard-copy signature
  plan: team
  audit: true                              # who approved what, when — server-side, from the session (the approval trail)
  auth_otp: false                          # no mail flow in the demo; password sign-in only
  brand: { color: "#0F766E", name: Sonic Group }

design:
  shell: sidebar
  tone: graphite
  canvas: paper
  direction: "Calm and ledger-like: centre coordinators on phones, HO, the Director and Accounts on laptops; one teal accent, colour only for status."
  sidebar: { style: light, footer: profile }

requirements:
  - { id: R1,  text: "A Centre Coordinator takes a photo of an expense bill on their mobile and uploads it to the application" }
  - { id: R2,  text: "A Centre Coordinator reads the bill data filled in by AI from the photo — vendor, GST, GST rates and narration" }
  - { id: R3,  text: "Accounts sees each bill mapped to the vendor's Tally ledger name and the correct expense head from the mapping Mugdha provides" }
  - { id: R4,  text: "A Centre Coordinator verifies and approves the bill as the first of four approval stages" }
  - { id: R5,  text: "An HO Coordinator approves the bill after the centre" }
  - { id: R6,  text: "The Director checks and approves the bill online" }
  - { id: R7,  text: "Accounts does the finalisation of the approved bill" }
  - { id: R8,  text: "The Director sees how many bills came on a particular day, sorted by day" }
  - { id: R9,  text: "The Director sees every bill from one vendor since the start, categorised by vendor" }
  - { id: R10, text: "An HO Coordinator flags a bill that seems incorrect and adds remarks" }
  - { id: R11, text: "A Centre Coordinator replies to a raised query with the correction in the application" }
  - { id: R12, text: "Accounts generates the Tally XML import file for an approved bill with one click" }
  - { id: R13, text: "Accounts sees each Tally entry fall under the correct head with the GST split" }
  - { id: R14, text: "Accounts records the agreements whose summaries Sonic Group provides" }
  - { id: R15, text: "The Director sees the expected sales from the agreements" }
  - { id: R16, text: "Accounts gets the sales invoice prepared one day before each agreement's due date" }
  - { id: R17, text: "Accounts downloads the sales invoice as a Tally XML import file" }
  - { id: R18, text: "Accounts maintains the vendor → ledger → expense-head mapping and maps an unmatched vendor once" }   # ⚑ inferred
  - { id: R19, text: "A Centre Coordinator sees only their own centre's bills; HO, Director and Accounts see all centres" }   # ⚑ inferred
  - { id: R20, text: "The Director sees one overview of bills pending at each stage, open queries and this month's expected sales" }   # ⚑ inferred

role_groups:
  head_office: [admin, ho, director, accounts]

roles:
  - { key: admin,    label: Admin,              desc: "Sees everything; maintains centres, vendor ledgers and people", pages: ["*"], home: /, demo: { email: admin@sonicgroup.pucho.ai, password: admin12345, name: Mugdha Borate } }
  - { key: centre,   label: Centre Coordinator, desc: "Photographs and uploads the centre's bills, verifies what AI read, answers queries", pages: [my_bills, settings], home: /my-bills, scope: { bills: Centre_Coordinator }, demo: { email: centre@sonicgroup.pucho.ai, password: centre12345, name: Rohan Patil } }
  - { key: ho,       label: HO Coordinator,     desc: "Approves bills from every centre after the centre, or raises a query", pages: [ho_approvals, bills, settings], home: /ho-approvals, demo: { email: ho@sonicgroup.pucho.ai, password: hocoord12345, name: Sneha Kulkarni } }
  - { key: director, label: Director,           desc: "Approves bills online and sees every bill, query and the expected sales", pages: [overview, director_approvals, bills, income, settings], home: /, demo: { email: director@sonicgroup.pucho.ai, password: director12345, name: Anil Mehta } }
  - { key: accounts, label: Accounts,           desc: "Finalises approved bills, keeps the vendor ledger mapping, raises sales invoices and exports to Tally", pages: [accounts_approvals, tally_export, bills, income, vendors, centres, settings], home: /accounts, demo: { email: accounts@sonicgroup.pucho.ai, password: accounts12345, name: Priya Joshi } }

journeys:
  - { role: centre,   does: "Upload a bill photo and send it to HO", lands: my_bills, steps: ["Tap Upload bill", "Take the photo and pick the centre — AI reads the bill", "Check the fields AI filled → Verify & send to HO"] }
  - { role: centre,   does: "Answer a query on a bill", lands: my_bills, steps: ["The query sits at the top of My bills with its remarks", "Reply & resend — the correction goes back to the stage that asked"] }
  - { role: ho,       does: "Approve or query the bills from the centres", lands: ho_approvals, steps: ["HO approvals opens on the waiting bills", "Approve — or Raise query with remarks"] }
  - { role: director, does: "Approve the bills waiting for the Director", lands: overview, steps: ["Overview opens on Waiting for your approval", "Approve on the row — or open Approvals to raise a query"] }
  - { role: director, does: "See the bills of one day or one vendor", lands: overview, steps: ["All bills", "Pick the day preset — or group by vendor"] }
  - { role: accounts, does: "Finalise bills and import them into Tally", lands: accounts_approvals, steps: ["Finalise bills opens on the bills the Director approved", "Finalise — Tally ledger and expense head already filled", "Tally export → Download Tally XML (one click)"] }
  - { role: accounts, does: "Raise tomorrow's sales invoices", lands: income, steps: ["Agreements & sales opens on Due tomorrow", "Raise invoice on the row", "Tally export → Download Tally XML"] }
  - { role: admin,    does: "Add a centre and its coordinator", lands: overview, steps: ["Setup → Centres → Add centre", "Users & roles → add the coordinator"] }

metrics:
  at_centre:       { entity: bills, label: To verify at centre, where: "Status=At Centre", tone: warn, icon: Camera }
  with_ho:         { entity: bills, label: Waiting with HO, where: "Status=With HO", tone: info, icon: Building2 }
  with_director:   { entity: bills, label: Waiting for Director, where: "Status=With Director", tone: warn, icon: Stamp }
  with_accounts:   { entity: bills, label: Waiting with Accounts, where: "Status=With Accounts", tone: info, icon: Calculator }
  open_queries:    { entity: bills, label: Open queries, where: "Status=Query", tone: bad, icon: MessageSquareWarning }
  unmapped:        { entity: bills, label: Vendor not mapped, where: "Tally_Ledger is empty and Status not in [Cancelled, Exported]", tone: warn, icon: Link2Off }
  bills_today:     { entity: bills, label: Bills today, where: "Uploaded_At=today", icon: Receipt }
  bills_month:     { entity: bills, label: Bills this month, where: "Uploaded_At in month and Status!=Cancelled", icon: Receipt }
  bills_value:     { entity: bills, label: Bill value this month, where: "Uploaded_At in month and Status!=Cancelled", sum: Total_Amount, format: money, icon: IndianRupee }
  ready_tally:     { entity: bills, label: Bills ready for Tally, where: "Status=Finalised", tone: ok, icon: FileDown }
  exported_month:  { entity: bills, label: Exported this month, where: "Status=Exported and Exported_At in month", tone: ok, icon: CheckCircle2 }
  invoices_ready:  { entity: sales_invoices, label: Sales invoices ready, where: "Status=Prepared", tone: ok, icon: FileDown }
  expected_sales:  { entity: agreements, label: Expected sales / month, where: "Status=Active", sum: Monthly_Total, format: money, icon: TrendingUp }
  active_agreements: { entity: agreements, label: Active agreements, where: "Status=Active", icon: FileSignature }
  due_tomorrow:    { entity: agreements, label: Due tomorrow, where: "Next_Due_Date<=today+1 and Invoice_Status!=Raised and Status=Active", tone: warn, icon: CalendarClock }
  ending_soon:     { entity: agreements, label: Ending in 60 days, where: "End_Date<=today+60 and End_Date>=today and Status=Active", tone: warn, icon: CalendarX }

