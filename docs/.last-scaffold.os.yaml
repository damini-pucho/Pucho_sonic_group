    covers: [R6, R8, R9, R15, R20]
    kind: overview
    route: /
    label: Overview
    icon: LayoutDashboard
    subtitle: Bills waiting at each stage, open queries and this month's expected sales
    desc: What needs the Director today, then the month in numbers
