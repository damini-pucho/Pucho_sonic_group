    desc: Centres across Maharashtra and other states
    entity: centres
    roles: [admin, accounts]
    blocks:
      - type: table
        columns: [ { key: Centre_Name, header: Centre, type: text, sub: City }, { key: State, type: tag }, { key: Coordinator, type: owner }, { key: Phone, type: text }, { key: Status, type: badge } ]
        search: [Centre_Name, City, Coordinator]
        filters: [State]
        drawer: { title_column: Centre_Name, sections: [ { type: tiles, title: Centre, columns: [City, State, Coordinator, Phone] }, { type: list, title: Latest bills, entity: bills, match: { column: Centre, equals: Centre_Name }, label: Vendor_Name, value: Total_Amount, limit: 6, empty: "No bill yet" } ] }
        actions: { header: [add_centre], row: [edit_centre] }
    modals:
      - { id: add_centre, kind: create, title: Add centre, direct: insert, context: { Status: Active }, columns: 2, submit: Save, success: "Centre added", fields: [ { key: Centre_Name, label: Centre name, type: text, required: true, placeholder: "e.g. Pune — Baner" }, { key: City, label: City, type: text, required: true }, { key: State, label: State, type: text, required: true }, { key: Coordinator, label: Centre coordinator, type: text, required: true }, { key: Phone, label: Phone, type: text } ] }
      - { id: edit_centre, kind: edit, title: Edit centre, direct: patch, columns: 2, fields: [ { key: Coordinator, label: Centre coordinator, type: text }, { key: Phone, label: Phone, type: text }, { key: Status, label: Status, type: select, options_status: true } ] }

  - id: activity
    kind: system
    route: /activity
    label: Activity log
    group: Setup
    icon: History
    desc: Every change — who approved, queried, finalised or exported which bill, and when
    roles: [admin]
    read_only: "The approval trail is written by the app from the session; nobody edits it"

  - id: settings
    kind: settings
    route: /settings
    label: Settings
    icon: Settings
    desc: Profile and password
    roles: [admin, centre, ho, director, accounts]

rules_in_code:
  - { text: "The four stages are status changes the app makes itself (direct patch): At Centre → With HO → With Director → With Accounts → Finalised → Exported; who moved it and when is the audit row written from the session", covers: [R4, R5, R6, R7] }
  - { text: "A query records Query_From (HO · Director · Accounts); the centre's reply returns the bill to exactly that stage", covers: [R10, R11] }
  - { text: "Tally XML is built by code in the app (src/custom/TallyExport): one Purchase voucher per bill — vendor ledger credited with the total, expense head debited with the taxable value, Input CGST / SGST / IGST debited with the GST; one Sales voucher per invoice — tenant ledger debited, income head credited, Output CGST + SGST (same state as the centre) or IGST; downloaded as one file, then the rows are marked Exported", covers: [R12, R13, R17] }
  - { text: "A Centre Coordinator's reads and writes of bills are pinned to Centre_Coordinator = the signed-in person, server-side", covers: [R19] }
  - { text: "Expected sales = sum of Monthly_Total over Active agreements; Due tomorrow = Next_Due_Date ≤ tomorrow and not yet raised", covers: [R15, R16, R20] }

not_in_v1:
  - { text: "Direct push of entries into Tally Prime — v1 builds the XML Accounts imports in Tally (MoM decision 2); pending Chintan's confirmation", covers: [] }
  - { text: "Spine application integration — pending Chintan; 'first, we need to get this working'", covers: [] }
  - { text: "Raising tomorrow's sales invoices without a click (an unattended daily run) — v1 puts them on Accounts' Due tomorrow queue for one click; the kit's scheduled flows only sync from Tally", covers: [] }
  - { text: "Reading data back from Tally (ledgers, outstanding) — not asked for in v1", covers: [] }
  - { text: "Marathi / Hindi labels — English chosen at intake", covers: [] }
